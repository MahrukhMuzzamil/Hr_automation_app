# Serves the built React SPA inside the `frontend` container. The top-level
# reverse-proxy (nginx service) forwards non-/api traffic here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
