upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Allow reasonably large resume uploads (PDF/DOCX)
    client_max_body_size 20M;

    # --- API ---
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Django admin ---
    location /admin/ {
        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django collected static (admin, DRF browsable API) ---
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
    }

    # --- Uploaded resumes (served through the API's auth in production;
    #     here exposed read-only for download links) ---
    location /media/ {
        internal;
        alias /media/;
    }

    # --- React SPA ---
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
